name: feature-pipeline
on: [push]
permissions:
  contents: read
  statuses: write
  security-events: read
jobs: 
  feature-pipeline:
    if: github.ref != 'refs/heads/main' # if not main branch. it works
    uses: Shankar-t-Codes/reuseable-workflows/.github/workflows/featured-node-js-pipeline.yaml@main
    with:
      project: ellamma-ecommerce
      component: catalogue
      environment: dev
    secrets: inherit

  dev-pipeline: #dev goes to deploy   
    if: github.ref == 'refs/heads/main' # if main branch. it works
    uses: Shankar-t-Codes/reuseable-workflows/.github/workflows/dev-node-js-pipeline.yaml@main
    with:
      project: ellamma-ecommerce
      component: catalogue
      environment: dev
    secrets: inherit